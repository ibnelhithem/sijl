name: ci

# Pull requests, plus main after a merge. Pushes to feature branches are covered by their PR.
# By hand: Actions -> ci -> Run workflow, or `gh workflow run ci.yml --ref <branch>`.
# check, check-macos, and secret-scan run on every one of these triggers.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs: a tag can be moved, a SHA cannot.
      # setup-uv publishes only full release tags (no floating v10), so a major tag fails.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no later step uses git against GitHub
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # A red run within 1-2 s and no steps executed is a GitHub billing/platform block, not a test.
      # git's version is printed first: some of its error messages differ between versions.
      - run: |
          git --version
          scripts/check.sh

  check-macos:
    # The same checks on macOS, on every pull request and after each merge to main: macOS-only
    # failures are caught before a merge. Runners are free for public repositories.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Which git runs matters: the runner image's own, or Apple's older /usr/bin/git.
      - run: |
          command -v git
          git --version
          scripts/check.sh

  secret-scan:
    # Credential scan on every pull request and every push to main. No condition: one would
    # let a pull request skip it. fetch-depth 0 is the whole history; the default checkout
    # is one commit, and this scan reads git history.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: sh scripts/secret-scan.sh
